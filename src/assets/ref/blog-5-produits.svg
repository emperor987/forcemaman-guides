<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" rx="16" fill="#FAF6F1"/>
  <circle cx="200" cy="200" r="140" fill="#E8DFD4" opacity="0.25"/>
  <!-- 5 product icons in a grid -->
  <g stroke="#5C4A3A" stroke-width="1.3" stroke-linecap="round" fill="none">
    <!-- 1. Baby bottle (top left) -->
    <rect x="100" y="110" width="22" height="50" rx="5"/>
    <rect x="97" y="100" width="28" height="14" rx="4"/>
    <circle cx="111" cy="128" r="1.5" fill="#5C4A3A"/>
    <!-- 2. Diaper (top right) -->
    <path d="M270 110 C270 100, 280 95, 290 95 C300 95, 310 100, 310 110 L310 145 C310 155, 300 160, 290 160 C280 160, 270 155, 270 145Z"/>
    <path d="M275 125 L305 125" stroke="#C97D5D" stroke-width="0.8"/>
    <!-- 3. Baby carrier/wrap (center) -->
    <ellipse cx="200" cy="210" rx="55" ry="45"/>
    <path d="M160 195 C175 185, 225 185, 240 195"/>
    <circle cx="200" cy="195" r="12"/>
    <circle cx="197" cy="193" r="1.5" fill="#5C4A3A"/>
    <circle cx="203" cy="193" r="1.5" fill="#5C4A3A"/>
    <!-- 4. Thermometer (bottom left) -->
    <rect x="108" y="280" width="8" height="40" rx="4"/>
    <circle cx="112" cy="328" r="8"/>
    <line x1="112" y1="310" x2="112" y2="325" stroke="#C97D5D" stroke-width="2"/>
    <!-- 5. Pacifier (bottom right) -->
    <circle cx="290" cy="295" r="10"/>
    <circle cx="290" cy="295" r="4"/>
    <path d="M290 305 L290 320"/>
    <ellipse cx="290" cy="325" rx="12" ry="8"/>
  </g>
  <!-- Small colored dots -->
  <circle cx="155" cy="155" r="3" fill="#C97D5D" opacity="0.3"/>
  <circle cx="245" cy="155" r="3" fill="#8A9A7E" opacity="0.3"/>
  <circle cx="155" cy="270" r="3" fill="#A78BA3" opacity="0.3"/>
  <circle cx="245" cy="270" r="3" fill="#C97D5D" opacity="0.3"/>
</svg>