<svg width="1400" height="1600" viewBox="0 0 1400 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cinq produits pour simplifier la vie avec un bébé">
  <rect width="1400" height="1600" fill="#FAF6F1"/>
  <circle cx="1150" cy="300" r="320" fill="rgba(201,125,93,0.12)"/>
  <circle cx="260" cy="1330" r="360" fill="rgba(138,154,126,0.14)"/>
  <circle cx="700" cy="820" r="430" fill="none" stroke="rgba(92,74,58,0.12)" stroke-width="2"/>

  <!-- Chariot postpartum (terracotta) -->
  <g>
    <rect x="210" y="330" width="360" height="440" rx="44" fill="#C97D5D"/>
    <rect x="300" y="420" width="180" height="26" rx="13" fill="rgba(255,255,255,0.55)"/>
    <rect x="330" y="480" width="120" height="22" rx="11" fill="rgba(255,255,255,0.4)"/>
    <circle cx="310" cy="720" r="34" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="10"/>
    <circle cx="470" cy="720" r="34" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="10"/>
  </g>

  <!-- Carnet cerveau externe (sage) -->
  <g>
    <rect x="830" y="330" width="360" height="440" rx="44" fill="#8A9A7E"/>
    <rect x="910" y="430" width="200" height="240" rx="14" fill="#FAF6F1"/>
    <rect x="940" y="470" width="140" height="16" rx="8" fill="rgba(92,74,58,0.3)"/>
    <rect x="940" y="516" width="110" height="16" rx="8" fill="rgba(92,74,58,0.22)"/>
    <rect x="940" y="562" width="130" height="16" rx="8" fill="rgba(92,74,58,0.22)"/>
    <rect x="940" y="608" width="90" height="16" rx="8" fill="rgba(92,74,58,0.22)"/>
  </g>

  <!-- Organisateur zone départ (mauve) -->
  <g>
    <rect x="210" y="900" width="360" height="440" rx="44" fill="#A78BA3"/>
    <line x1="390" y1="980" x2="390" y2="1180" stroke="rgba(255,255,255,0.85)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="390" cy="970" r="26" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="12"/>
    <rect x="330" y="1200" width="120" height="90" rx="14" fill="rgba(255,255,255,0.4)"/>
    <rect x="300" y="1216" width="180" height="16" rx="8" fill="rgba(255,255,255,0.3)"/>
  </g>

  <!-- Biberon (card creme, trait sombre) -->
  <g>
    <rect x="830" y="900" width="360" height="440" rx="44" fill="#E8DFD4"/>
    <rect x="970" y="1000" width="80" height="240" rx="40" fill="none" stroke="#5C4A3A" stroke-width="12"/>
    <rect x="930" y="1080" width="160" height="60" rx="30" fill="none" stroke="#5C4A3A" stroke-width="12"/>
    <rect x="955" y="1260" width="110" height="50" rx="16" fill="#C97D5D"/>
    <rect x="985" y="1040" width="50" height="14" rx="7" fill="rgba(92,74,58,0.35)"/>
  </g>
