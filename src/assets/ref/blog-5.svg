  <!-- Small heart -->
  <path d="M280 150 C280 144, 288 141, 288 147 C288 141, 296 144, 296 150 C296 157, 288 162, 288 162 C288 162, 280 157, 280 150Z" fill="#C97D5D" fill-opacity="0.2" stroke="#C97D5D" stroke-width="1"/>
  <circle cx="100" cy="320" r="2.5" fill="#8A9A7E" opacity="0.3"/>
</svg>