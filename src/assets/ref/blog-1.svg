    <line x1="135" y1="166" x2="185" y2="166" stroke="#C97D5D" stroke-width="1" opacity="0.5"/>
    <line x1="135" y1="184" x2="190" y2="184" stroke="#C97D5D" stroke-width="1" opacity="0.5"/>
    <line x1="135" y1="202" x2="175" y2="202" stroke="#C97D5D" stroke-width="1" opacity="0.5"/>
