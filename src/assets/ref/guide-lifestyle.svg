    <path d="M380 225 C390 260, 410 310, 400 380"/>
    <!-- Arms holding baby -->
    <path d="M330 260 C300 270, 280 300, 300 340"/>
    <path d="M390 260 C420 270, 440 300, 420 340"/>
    <!-- Baby in arms -->
    <ellipse cx="360" cy="310" rx="35" ry="30"/>
    <circle cx="360" cy="295" r="18"/>
    <!-- Baby details -->
    <circle cx="354" cy="293" r="2" fill="#5C4A3A"/>
    <circle cx="366" cy="293" r="2" fill="#5C4A3A"/>
    <path d="M356 300 Q360 303 364 300"/>
  </g>
  <!-- Decorative elements -->
